{% set name = "scikit-build-core" %}
{% set version = "1.0.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: a4d7a05978ee37975c37743510c8991e2debce7ef83afb0a07c0c576fd4f16e8

build:
  number: 0
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.24
    - hatch-vcs >=0.4
  run:
    - python
    - exceptiongroup >=1.0  # [py<311]
    - importlib_resources >=1.3  # [py<39]
    - packaging >=23.2
    - pathspec >=0.12.0
    - tomli >=1.2.2  # [py<311]
    - typing-extensions >=4  # [py<311]

{% set tests_to_deselect = "" %}
# deselect these tests on win with symlink privileges OSError: [WinError 1314]
{% set tests_to_deselect = tests_to_deselect + " --deselect=tests/test_file_processor.py::test_on_each_with_symlink" %}           # [win]
# deselect these tests on win while build_wheel and build_editable
{% set tests_to_deselect = tests_to_deselect + " --deselect=tests/test_pyproject_extra_dirs.py::test_pep517_wheel_extra_dirs" %}  # [win]
{% set tests_to_deselect = tests_to_deselect + " --deselect=tests/test_pyproject_pep660.py::test_pep660_wheel" %}                 # [win]

{% set markers_to_skip = "isolated or network or virtualenv or setuptools or broken_on_urct" %}

test:
  imports:
    - scikit_build_core
  source_files:
    - tests
    - src
    - pyproject.toml
  commands:
    - pip check
    # Ninja generators do not support the Visual Studio-specific platform and
    # toolset values inherited from the Windows conda build environment.
    - set CMAKE_GENERATOR_PLATFORM=  # [win]
    - set CMAKE_GENERATOR_TOOLSET=   # [win]
    # Prevent conda's setuptools-scm activation hook from overriding versions
    # derived from temporary Git repositories created by the tests.
    - unset SETUPTOOLS_SCM_PRETEND_VERSION  # [osx]
    - pytest -vv -ra --showlocals -m "not ({{ markers_to_skip }})" {{ tests_to_deselect }}
  requires:
    # test-core
    - python-build >=0.8
    - cattrs >=22.2
    - filelock >=3.8
    - hatchling >=1.24
    - hatch-vcs >=0.4
    - pip >=23  # [py<313]
    - pip >=24.1  # [py>=313]
    - pytest >=7.2,!=9.1.0
    - pytest-subprocess >=1.5
    - setuptools >=43    # [py<39]
    - setuptools >=45    # [py==39]
    - setuptools >=49    # [py>=310 and py<312]
    - setuptools >=66.1  # [py>=312]
    - virtualenv >=20.20
    - wheel >=0.40
    # test-meta
    - hatch-fancy-pypi-readme >=23.2
    - setuptools-scm >=5
    # test-numpy
    - numpy
    # test-pybind11
    - pybind11 >=2.11
    # Build tools required by the selected tests
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - make  # [unix]
    - ninja-base  # [not win]

about:
  home: https://github.com/scikit-build/scikit-build-core
  summary: Build backend for CMake based projects
  description: |
    Scikit-build-core is a ground-up rewrite of the classic Scikit-build, a bridge 
    between Python package build systems and CMake, the most popular compiled language 
    build system.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://scikit-build-core.readthedocs.io
  dev_url: https://github.com/scikit-build/scikit-build-core

extra:
  recipe-maintainers:
    - conda-forge/scikit-build
    - henryiii
    - jcfr
    - thewtex
  skip-lints:
    # pip is present in test requirements with upstream Python-specific constraints.
    - missing_test_requirement_pip
